    display: flex;
    align-items: center;
    gap: 0.75rem;
    padding: 0.65rem 0.85rem;
    border-radius: 0.75rem;
    font-size: 0.875rem;
    font-weight: 600;
    color: rgb(var(--muted));
    transition: all 0.15s ease;
    cursor: pointer;
    text-align: left;
    width: 100%;
    border: 1px solid transparent;
  }

    background-color: rgb(var(--raised));
    color: rgb(var(--ink));

  .bible-tool-btn.is-active {
    background-color: rgba(var(--brand-rgb, 37, 99, 235), 0.1);

    width: 1.5rem;

    background-color: rgba(var(--brand-rgb, 37, 99, 235), 0.1);
    border-radius: 9999px;
    margin-right: 0.5rem;
    vertical-align: middle;
  }
  .typing-letter {
    font-family: monospace;
    font-size: 1.125rem;
    transition: color 0.1s ease;
  }
  .typing-letter.correct { color: #10b981; }
  .typing-letter.incorrect { color: #ef4444; background-color: rgba(239, 68, 68, 0.15); border-radius: 2px; }
  .typing-letter.current { border-bottom: 2px solid rgb(var(--brand)); }
</style>

<script>
(() => {
  'use strict';

  // ---------------------------------------------------------------------------
  // State & Utilities
  // ---------------------------------------------------------------------------
  const state = {
    activeTool: 'reader',
    book: 'John',
    chapter: 1,
    version: 'KHMER_OLD_1954',
    version2: 'KJV',
    verses: [],
    verses2: [],
    loading: false,
    fontSize: 17,
    audioPlaying: false,
    
    // Designer
    designer: {
      textKhmer: '«ដ្បិតព្រះទ្រង់ស្រឡាញ់មនុស្សលោក ដល់ម៉្លេះបានជាទ្រង់ប្រទានព្រះរាជបុត្រាទ្រង់តែ១ ដើម្បីឲ្យអ្នកណាដែលជឿដល់ព្រះរាជបុត្រានោះ មិនត្រូវវិនាសឡើយ គឺឲ្យមានជីវិតអស់កល្បជានិច្ចវិញ»',
      textEnglish: '“For God so loved the world, that he gave his only begotten Son.”',
      ref: 'យ៉ូហាន ៣:១៦ • John 3:16',
      bgIndex: 0,
      customBg: null,
      aspectRatio: '1:1', // '1:1', '9:16', '16:9'
      fontFamily: 'Koh Santepheap',
      fontSize: 24,
      overlayOpacity: 40,
      textAlign: 'center',
      textColor: '#ffffff'
    },

    // Daily
    daily: null,

    // Concordance
    concordanceQuery: '',
    concordanceResult: null,

    // Typing
    typingPassageId: 'psalm-23',
    typingInput: '',
    typingStartTime: 0,
    typingWpm: 0,
    typingAccuracy: 100,
    typingFinished: false,

    // Notes
    notes: {
      Doctrine: '',
      Encouragement: '',
      Application: ''
    }
  };

  const BOOKS = [
    { name: 'Genesis', km: 'លោកុប្បត្តិ', ch: 50, test: 'OT' },
    { name: 'Exodus', km: 'និក្ខមនំ', ch: 40, test: 'OT' },
    { name: 'Leviticus', km: 'លេវីវិន័យ', ch: 27, test: 'OT' },
    { name: 'Numbers', km: 'ជនគណនា', ch: 36, test: 'OT' },
    { name: 'Deuteronomy', km: 'ចោទិយកថា', ch: 34, test: 'OT' },
    { name: 'Joshua', km: 'យ៉ូស៊ូវ៉ា', ch: 24, test: 'OT' },
    { name: 'Judges', km: 'ចៅហ្វាយ', ch: 21, test: 'OT' },
    { name: 'Ruth', km: 'រូថ', ch: 4, test: 'OT' },
    { name: '1 Samuel', km: '១ សាំយូអែល', ch: 31, test: 'OT' },
    { name: '2 Samuel', km: '២ សាំយូអែល', ch: 24, test: 'OT' },
    { name: '1 Kings', km: '១ ពង្សាវតាក្សត្រ', ch: 22, test: 'OT' },
    { name: '2 Kings', km: '២ ពង្សាវតាក្សត្រ', ch: 25, test: 'OT' },
    { name: 'Psalms', km: 'ទំនុកតម្កើង', ch: 150, test: 'OT' },
    { name: 'Proverbs', km: 'សុភាសិត', ch: 31, test: 'OT' },
    { name: 'Ecclesiastes', km: 'សាស្ដា', ch: 12, test: 'OT' },
    { name: 'Isaiah', km: 'អេសាយ', ch: 66, test: 'OT' },
    { name: 'Jeremiah', km: 'យេរេមា', ch: 52, test: 'OT' },
    { name: 'Daniel', km: 'ដានីយ៉ែល', ch: 12, test: 'OT' },
    { name: 'Matthew', km: 'ម៉ាថាយ', ch: 28, test: 'NT' },
    { name: 'Mark', km: 'ម៉ាកុស', ch: 16, test: 'NT' },
    { name: 'Luke', km: 'លូកា', ch: 24, test: 'NT' },
    { name: 'John', km: 'យ៉ូហាន', ch: 21, test: 'NT' },
    { name: 'Acts', km: 'កិច្ចការ', ch: 28, test: 'NT' },
    { name: 'Romans', km: 'រ៉ូម', ch: 16, test: 'NT' },
    { name: '1 Corinthians', km: '១ កូរិនថូស', ch: 16, test: 'NT' },
    { name: '2 Corinthians', km: '២ កូរិនថូស', ch: 13, test: 'NT' },
    { name: 'Galatians', km: 'កាឡាទី', ch: 6, test: 'NT' },
    { name: 'Ephesians', km: 'អេភេសូរ', ch: 6, test: 'NT' },
    { name: 'Philippians', km: 'ភីលីព', ch: 4, test: 'NT' },
    { name: 'Colossians', km: 'កូឡូស', ch: 4, test: 'NT' },
    { name: '1 Thessalonians', km: '១ ថែស្សាឡូនិច', ch: 5, test: 'NT' },
    { name: '1 Timothy', km: '១ ធីម៉ូថេ', ch: 6, test: 'NT' },
    { name: '2 Timothy', km: '២ ធីម៉ូថេ', ch: 4, test: 'NT' },
    { name: 'Hebrews', km: 'ហេព្រើរ', ch: 13, test: 'NT' },
    { name: 'James', km: 'យ៉ាកុប', ch: 5, test: 'NT' },
    { name: '1 Peter', km: '១ ពេត្រុស', ch: 5, test: 'NT' },
    { name: '1 John', km: '១ យ៉ូហាន', ch: 5, test: 'NT' },
    { name: 'Revelation', km: 'វិវរណៈ', ch: 22, test: 'NT' }
  ];

  const WALLPAPERS = [
    '/assets/images/wallpapers/wallpaper-01.jpg',
    '/assets/images/wallpapers/wallpaper-02.jpg',
    '/assets/images/wallpapers/wallpaper-03.jpg',
    '/assets/images/wallpapers/wallpaper-04.jpg',
    '/assets/images/wallpapers/wallpaper-05.jpg',
    '/assets/images/wallpapers/wallpaper-06.jpg',
    '/assets/images/wallpapers/wallpaper-07.jpg',
    '/assets/images/wallpapers/wallpaper-08.jpg'
  ];

  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => [...r.querySelectorAll(s)];
  const esc = (s) => String(s || '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  // ---------------------------------------------------------------------------
  // Tool Navigation
  // ---------------------------------------------------------------------------
  function setTool(toolName) {
    state.activeTool = toolName;
    $$('.bible-tool-btn').forEach(btn => {
      btn.classList.toggle('is-active', btn.dataset.tool === toolName);
    });
    $$('[data-tool-mob]').forEach(btn => {
      btn.classList.toggle('btn-primary', btn.dataset.toolMob === toolName);
      btn.classList.toggle('btn-neutral', btn.dataset.toolMob !== toolName);
    });
    render();
  }

  // ---------------------------------------------------------------------------
  // Data Fetching Handlers
  // ---------------------------------------------------------------------------
  async function loadChapterVerses() {
    state.loading = true;
    render();
    try {
      if (state.activeTool === 'parallel') {
        const res = await fetch(`/api/bible/chapter?book=${encodeURIComponent(state.book)}&chapter=${state.chapter}&version=${state.version}&version2=${state.version2}`);
        const json = await res.json();
        if (json.success && json.data) {
          state.verses = json.data.items.map(i => ({ v: i.v, text: i.text1, reference: i.reference }));
          state.verses2 = json.data.items.map(i => ({ v: i.v, text: i.text2, reference: i.reference }));
        }
      } else {
        const res = await fetch(`/api/bible/chapter?book=${encodeURIComponent(state.book)}&chapter=${state.chapter}&version=${state.version}`);
        const json = await res.json();
        if (json.success && json.data) {
          state.verses = json.data.items || [];
        }
      }
    } catch (err) {
      console.warn('Verses fetch fallback:', err);
    } finally {
      state.loading = false;
      render();
    }
  }

  async function loadDailyVerse() {
    if (state.daily) return;
    try {
      const res = await fetch('/api/bible/daily');
      const json = await res.json();
      if (json.success) state.daily = json.data;
    } catch (_) {}
  }

  async function loadConcordance() {
    try {
      const res = await fetch(`/api/bible/dictionary?q=${encodeURIComponent(state.concordanceQuery || '')}`);
      const json = await res.json();
      if (json.success) state.concordanceResult = json.data;
    } catch (_) {}
  }

  // ---------------------------------------------------------------------------
  // Render Tool Views
  // ---------------------------------------------------------------------------
  function renderControlsBar(isParallel = false) {
    const curBook = BOOKS.find(b => b.name === state.book) || BOOKS[0];
    const chaptersList = Array.from({ length: curBook.ch }, (_, i) => i + 1);

    return `
      <div class="card p-3.5 sm:p-4 rounded-2xl bg-surface border border-line shadow-sm space-y-3">
        <div class="grid grid-cols-2 sm:grid-cols-4 gap-2.5 items-end">
          
          <!-- Book Selector -->
          <div class="space-y-1">
            <label class="text-[11px] font-bold uppercase tracking-wider text-muted">Book • គម្ពីរ</label>
            <select id="sel-book" class="w-full bg-raised border border-line rounded-lg px-2.5 py-1.5 text-[13.5px] font-semibold text-ink outline-none focus:border-brand">
              ${BOOKS.map(b => `<option value="${b.name}" ${b.name === state.book ? 'selected' : ''}>${b.km} (${b.name})</option>`).join('')}
            </select>
          </div>

          <!-- Chapter Selector -->
          <div class="space-y-1">
            <label class="text-[11px] font-bold uppercase tracking-wider text-muted">Chapter • ជំពូក</label>
            <select id="sel-chapter" class="w-full bg-raised border border-line rounded-lg px-2.5 py-1.5 text-[13.5px] font-semibold text-ink outline-none focus:border-brand">
              ${chaptersList.map(c => `<option value="${c}" ${c === Number(state.chapter) ? 'selected' : ''}>Chapter ${c}</option>`).join('')}
            </select>
          </div>

          <!-- Version 1 Selector -->
          <div class="space-y-1">
            <label class="text-[11px] font-bold uppercase tracking-wider text-muted">Version • កំណែ</label>
            <select id="sel-version" class="w-full bg-raised border border-line rounded-lg px-2.5 py-1.5 text-[13px] font-medium text-ink outline-none focus:border-brand">
              <option value="KHMER_OLD_1954" ${state.version === 'KHMER_OLD_1954' ? 'selected' : ''}>🇰🇭 ខ្មែរ ១៩៥៤ (ពគប)</option>
              <option value="KJV" ${state.version === 'KJV' ? 'selected' : ''}>🇺🇸 King James (KJV)</option>
              <option value="WEB" ${state.version === 'WEB' ? 'selected' : ''}>🌐 World English (WEB)</option>
              <option value="ASV" ${state.version === 'ASV' ? 'selected' : ''}>📖 ASV 1901</option>
            </select>
          </div>

          ${isParallel ? `
          <!-- Version 2 Selector (Parallel) -->
          <div class="space-y-1">
            <label class="text-[11px] font-bold uppercase tracking-wider text-muted">Compare With</label>
            <select id="sel-version2" class="w-full bg-raised border border-line rounded-lg px-2.5 py-1.5 text-[13px] font-medium text-ink outline-none focus:border-brand">
              <option value="KJV" ${state.version2 === 'KJV' ? 'selected' : ''}>🇺🇸 King James (KJV)</option>
              <option value="WEB" ${state.version2 === 'WEB' ? 'selected' : ''}>🌐 World English (WEB)</option>
              <option value="KHMER_OLD_1954" ${state.version2 === 'KHMER_OLD_1954' ? 'selected' : ''}>🇰🇭 ខ្មែរ ១៩៥៤</option>
              <option value="ASV" ${state.version2 === 'ASV' ? 'selected' : ''}>📖 ASV 1901</option>
            </select>
          </div>
          ` : `
          <!-- Font Size & Actions -->
          <div class="flex items-center justify-end gap-1.5 pt-4 sm:pt-0">
            <button id="btn-font-dec" class="icon-btn w-8 h-8 rounded-lg border border-line hover:bg-raised text-[12px]" title="Smaller font">A-</button>
            <button id="btn-font-inc" class="icon-btn w-8 h-8 rounded-lg border border-line hover:bg-raised text-[14px] font-bold" title="Larger font">A+</button>
            <button id="btn-play-audio" class="btn btn-neutral !py-1.5 !px-3 !text-[12px] ml-auto flex items-center gap-1.5" title="Listen to Devotional">
              <i class="fa-solid fa-headphones text-brand"></i>
              <span>Audio</span>
            </button>
          </div>
          `}

        </div>
      </div>
    `;
  }

  // 1. Reader Tool
  function renderReader() {
    const curBook = BOOKS.find(b => b.name === state.book) || BOOKS[0];
    return `

          <p class="text-[13px] text-muted">Theological wisdom and encouraging thoughts from historical preachers and Christian leaders.</p>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          ${[
            { text: "Visit many good books, but live in the Bible.", author: "Charles Spurgeon", cat: "Scripture" },
            { text: "The Bible was not given for our information only, but for our transformation.", author: "D. L. Moody", cat: "Growth" },
            { text: "Faith does not eliminate questions. But faith knows where to take them.", author: "Elisabeth Elliot", cat: "Faith" },
            { text: "God is most glorified in us when we are most satisfied in Him.", author: "John Piper", cat: "Worship" },
            { text: "Never be afraid to trust an unknown future to a known God.", author: "Corrie ten Boom", cat: "Trust" },
            { text: "To be a Christian without prayer is no more possible than to be alive without breathing.", author: "Martin Luther", cat: "Prayer" }
          ].map(q => `
            <div class="card p-5 rounded-2xl bg-surface border border-line shadow-sm space-y-3">
              <div class="flex justify-between items-center text-xs text-muted">
                <span class="font-bold uppercase text-brand bg-brand/10 px-2.5 py-0.5 rounded-full">${q.cat}</span>
                <button class="icon-btn w-7 h-7 rounded hover:bg-raised text-muted" title="Copy" onclick="navigator.clipboard.writeText('${esc(q.text)} — ${esc(q.author)}'); window.toast && toast('Quote copied!');">
                  <i class="fa-regular fa-copy text-[12px]"></i>
                </button>
              </div>
              <p class="font-serif italic text-[15.5px] text-ink leading-relaxed">“${esc(q.text)}”</p>
              <div class="font-bold text-xs text-ink/80">— ${esc(q.author)}</div>
            </div>
          `).join('')}
        </div>
      </div>
    `;
  }

  // ---------------------------------------------------------------------------
  // Master Render & Event Binding
  // ---------------------------------------------------------------------------
  function render() {
    const root = $('#bible-view-root');
    if (!root) return;

    switch (state.activeTool) {
      case 'reader': root.innerHTML = renderReader(); break;
      case 'parallel': root.innerHTML = renderParallel(); break;
      case 'designer': root.innerHTML = renderDesigner(); drawDesignerCanvas(); break;
      case 'daily': root.innerHTML = renderDaily(); break;
      case 'concordance': root.innerHTML = renderConcordance(); break;
      case 'typing': root.innerHTML = renderTyping(); break;
      case 'notes': root.innerHTML = renderNotes(); break;
      case 'media': root.innerHTML = renderMedia(); break;
      case 'quotes': root.innerHTML = renderQuotes(); break;
      default: root.innerHTML = renderReader(); break;
    }

    bindEvents();
  }

  function bindEvents() {
    // Controls
    $('#sel-book')?.addEventListener('change', (e) => {
      state.book = e.target.value;
      state.chapter = 1;
      loadChapterVerses();
    });

    $('#sel-chapter')?.addEventListener('change', (e) => {
      state.chapter = Number(e.target.value);
      loadChapterVerses();
    });

    $('#sel-version')?.addEventListener('change', (e) => {
      state.version = e.target.value;
      loadChapterVerses();
    });

    $('#sel-version2')?.addEventListener('change', (e) => {
      state.version2 = e.target.value;
      loadChapterVerses();
    });

    $('#btn-font-dec')?.addEventListener('click', () => {
      state.fontSize = Math.max(14, state.fontSize - 2);
      render();
    });

    $('#btn-font-inc')?.addEventListener('click', () => {
      state.fontSize = Math.min(26, state.fontSize + 2);
      render();
    });

    $('#btn-play-audio')?.addEventListener('click', () => {
      setTool('daily');
    });

    // Designer inputs
    $('#card-txt-khmer')?.addEventListener('input', (e) => {
      state.designer.textKhmer = e.target.value;
      drawDesignerCanvas();
    });

    $('#card-txt-english')?.addEventListener('input', (e) => {
      state.designer.textEnglish = e.target.value;
      drawDesignerCanvas();
    });

    $('#card-txt-ref')?.addEventListener('input', (e) => {
      state.designer.ref = e.target.value;
      drawDesignerCanvas();
    });

    $('#card-overlay')?.addEventListener('input', (e) => {
      state.designer.overlayOpacity = Number(e.target.value);
      drawDesignerCanvas();
    });

    $('#card-font')?.addEventListener('change', (e) => {
      state.designer.fontFamily = e.target.value;
      drawDesignerCanvas();
    });

    $('#card-upload-bg')?.addEventListener('change', (e) => {
      const file = e.target.files && e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = () => {
          state.designer.customBg = reader.result;
          drawDesignerCanvas();
        };
        reader.readAsDataURL(file);
      }
    });

    // Typing
    $('#typing-input-box')?.addEventListener('input', (e) => {
      const val = e.target.value;
      if (!state.typingStartTime) state.typingStartTime = Date.now();
      const words = val.trim().split(/\s+/).length;
      const elapsedMin = (Date.now() - state.typingStartTime) / 60000;
      state.typingWpm = elapsedMin > 0 ? Math.round(words / elapsedMin) : 0;
    });
  }

  // ---------------------------------------------------------------------------
  // Canvas Rendering for Card Designer
  // ---------------------------------------------------------------------------
  function drawDesignerCanvas() {
    const canvas = $('#designer-canvas');
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    if (!ctx) return;

    const d = state.designer;
    const W = canvas.width;
    const H = canvas.height;

    const bgImg = new Image();
    bgImg.crossOrigin = 'anonymous';
    bgImg.src = d.customBg || WALLPAPERS[d.bgIndex] || WALLPAPERS[0];

    bgImg.onload = () => {
      // Draw wallpaper background
      ctx.drawImage(bgImg, 0, 0, W, H);

      // Draw dark gradient overlay
      ctx.fillStyle = `rgba(0, 0, 0, ${d.overlayOpacity / 100})`;
      ctx.fillRect(0, 0, W, H);

      // Top Brand Monogram
      ctx.fillStyle = '#EBB94F';
      ctx.font = 'bold 22px Inter, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('FAITH IN • ព្រះគម្ពីរ', W / 2, 100);

      // Khmer Verse Text
      ctx.fillStyle = '#ffffff';
      ctx.font = `bold 36px "${d.fontFamily}", sans-serif`;
      ctx.textAlign = 'center';

      wrapText(ctx, d.textKhmer, W / 2, H / 2 - 80, W - 180, 58);

      // English Verse Text
      if (d.textEnglish) {
        ctx.fillStyle = 'rgba(255, 255, 255, 0.85)';
        ctx.font = 'italic 24px Lora, Georgia, serif';
        wrapText(ctx, d.textEnglish, W / 2, H / 2 + 130, W - 220, 38);
      }

      // Reference Footer
      ctx.fillStyle = '#EBB94F';
      ctx.font = 'bold 24px Inter, sans-serif';
      ctx.fillText(d.ref, W / 2, H - 100);
    };
  }

  function wrapText(ctx, text, x, y, maxWidth, lineHeight) {
    const words = text.split(' ');
    let line = '';
    let curY = y;

    for (let n = 0; n < words.length; n++) {
      const testLine = line + words[n] + ' ';
      const metrics = ctx.measureText(testLine);
      const testWidth = metrics.width;
      if (testWidth > maxWidth && n > 0) {
        ctx.fillText(line, x, curY);
        line = words[n] + ' ';
        curY += lineHeight;
      } else {
        line = testLine;
      }
    }
    ctx.fillText(line, x, curY);
  }

  // ---------------------------------------------------------------------------
  // Global Window Helper Handlers
  // ---------------------------------------------------------------------------
  window.selectCardBg = (index) => {
    state.designer.bgIndex = index;
    state.designer.customBg = null;
    drawDesignerCanvas();
  };

  window.downloadCardImage = () => {
    const canvas = $('#designer-canvas');
    if (!canvas) return;
    const link = document.createElement('a');
    link.download = `FaithIn-Scripture-${Date.now()}.png`;
    link.href = canvas.toDataURL('image/png');
    link.click();
  };

  window.copyCardImageToClipboard = async () => {
    const canvas = $('#designer-canvas');
    if (!canvas || !navigator.clipboard) return;
    try {
      canvas.toBlob(async (blob) => {
        if (blob) {
          await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]);
          if (window.toast) window.toast('Card image copied to clipboard!');
        }
      });
    } catch (_) {}
  };

  window.shareCardToFaithInFeed = () => {
    const d = state.designer;
    const content = `${d.textKhmer}\n\n${d.textEnglish}\n\n— ${d.ref}`;
    localStorage.setItem('faithin_draft_post', content);
    window.location.href = '/home';
  };

  window.copyVerseText = (text, ref) => {
    navigator.clipboard.writeText(`${text} (${ref})`);
    if (window.toast) window.toast('Verse copied!');
  };

  window.designSingleVerse = (text, ref) => {
    state.designer.textKhmer = text;
    state.designer.ref = ref;
    setTool('designer');
  };

  window.sendChapterToDesigner = () => {
    if (state.verses.length > 0) {
      state.designer.textKhmer = state.verses[0].text;
      state.designer.ref = `${state.book} ${state.chapter}`;
    }
    setTool('designer');
  };

  window.designDailyVerse = () => {
    if (state.daily) {
      state.designer.textKhmer = state.daily.khmer;
      state.designer.textEnglish = state.daily.text;
      state.designer.ref = `${state.daily.khmerRef} • ${state.daily.ref}`;
    }
    setTool('designer');
  };

  window.copyDailyVerse = () => {
    if (state.daily) {
      navigator.clipboard.writeText(`${state.daily.khmer}\n${state.daily.text}\n— ${state.daily.khmerRef}`);
      if (window.toast) window.toast('Daily verse copied!');
    }
  };

  window.playAudioTrack = (url) => {
    const player = $('#bible-audio-player');
    if (!player) return;
    player.src = url;
    player.play().catch(() => {});
    if (window.toast) window.toast('Playing audio devotional...');
  };

  window.searchConcordanceWord = () => {
    const val = $('#concordance-search')?.value || '';
    state.concordanceQuery = val;
    loadConcordance().then(render);
  };

  window.saveSermonNotesAction = () => {
    state.notes.Doctrine = $('#notes-doctrine')?.value || '';
    state.notes.Encouragement = $('#notes-encouragement')?.value || '';
    state.notes.Application = $('#notes-application')?.value || '';
    localStorage.setItem('faithin_sermon_notes', JSON.stringify(state.notes));
    if (window.toast) window.toast('Sermon notes saved!');
  };

  // ---------------------------------------------------------------------------
  // Initialization
  // ---------------------------------------------------------------------------
  document.addEventListener('DOMContentLoaded', () => {
    // Bind sidebar buttons
    $$('.bible-tool-btn').forEach(btn => {
      btn.addEventListener('click', () => setTool(btn.dataset.tool));
    });
    $$('[data-tool-mob]').forEach(btn => {
      btn.addEventListener('click', () => setTool(btn.dataset.toolMob));
    });

    // Check URL params (e.g. ?tool=designer&book=John&chapter=3)
    const params = new URLSearchParams(window.location.search);
    if (params.get('tool')) state.activeTool = params.get('tool');
    if (params.get('book')) state.book = params.get('book');
    if (params.get('chapter')) state.chapter = Number(params.get('chapter'));

    // Load initial data
    loadChapterVerses();
    loadDailyVerse();
    loadConcordance();
  });

})();
</script>
<script src="/faithin-app/assets/faithin-live.js?v=20260902-bible-v1"></script>
</body>
