<body class="font-sans min-h-screen pb-16 lg:pb-0" data-page="jobs" data-search="Search jobs, skills, organizations…">
<main class="max-w-[1200px] mx-auto px-3 sm:px-4 py-5 grid gap-5 lg:grid-cols-[232px_minmax(0,1fr)] xl:grid-cols-[232px_minmax(0,1fr)_312px] items-start" id="main">
<!-- ───── LEFT RAIL ───── -->
<aside class="hidden lg:block lg:sticky lg:top-[72px] space-y-4">
<nav class="card p-2 space-y-0.5">
<a class="side-link" href="/jobs?view=saved"><i class="fa-solid fa-bookmark text-blue-500"></i>My jobs</a>



<a class="side-link" href="/settings"><i class="fa-solid fa-gear text-muted"></i>Application settings</a>
</nav>
</aside>
<!-- ───── CENTER ───── -->
<section class="space-y-4 min-w-0">
<!-- search -->
<section class="card p-4 sm:p-5">
<h2 class="text-[19px] font-bold mb-4">Find your next calling</h2>
<form class="flex flex-col md:flex-row gap-2" onsubmit="return false">
<div class="relative flex-1">
<i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-faint text-[13px]"></i>
<input class="field !pl-10 !py-2.5" placeholder="Job title, keyword, or organization" type="text"/>
</div>
<div class="relative flex-1">
<i class="fa-solid fa-location-dot absolute left-3.5 top-1/2 -translate-y-1/2 text-faint text-[13px]"></i>
<input class="field !pl-10 !py-2.5" placeholder="City, province, or remote" type="text"/>
</div>
<button class="btn btn-primary !rounded-[10px] !px-7 !py-2.5">Search</button>
</form>
<div class="flex flex-wrap gap-2 mt-4 pt-4 border-t border-line" data-chip-group="">
<button class="chip is-on">All roles</button>
<button class="chip">Remote</button>
<button class="chip">Full-time</button>
<button class="chip">Pastoral</button>
<button class="chip">Non-profit</button>
</div>
</section>
<!-- results -->
<section class="card overflow-hidden">
<header class="px-4 py-3.5 border-b border-line flex items-center justify-between gap-3">
<div>
<h2 class="text-[15.5px] font-bold">Recommended for you</h2>
<p class="text-[12.5px] text-muted mt-0.5">Based on your profile and search history</p>
</div>
<button class="btn btn-primary !py-2 shrink-0">Post a job</button>
</header>
<div class="divide-y divide-line"><p class="p-6 text-center text-[13.5px] text-muted" data-placeholder="">Loading…</p></div>
<button class="w-full py-3 border-t border-line text-[13.5px] font-semibold text-brand hover:bg-raised transition">
        Show all recommended jobs <i class="fa-solid fa-arrow-right text-[11px] ml-1"></i>
</button>
</section>
</section>
<!-- ───── RIGHT RAIL ───── -->
<aside class="hidden xl:block xl:sticky xl:top-[72px] space-y-4">
<footer class="px-2 pb-4 text-center space-y-2">
<p class="text-[11.5px] text-muted">
<a class="hover:text-brand hover:underline" href="/about">About</a> 
         ·
        <a class="hover:text-brand hover:underline" href="/contact">Help Center</a> ·
        <a class="hover:text-brand hover:underline" href="/privacy">Privacy</a> · <a class="hover:text-brand hover:underline" href="/terms">Terms</a>
</p>
<p class="text-[11.5px] text-faint">Faith In Corporation © 2026</p>
</footer>
</aside>
</main>
<script src="/faithin-app/assets/faithin-runtime.js?v=20260831-v13"></script>

<script src="/faithin-app/assets/faithin-live.js?v=20260831-v13"></script>
</body>
</html>
